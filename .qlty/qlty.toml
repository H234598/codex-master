# All 69 merged definitions are enabled, including hidden tsc.
# tsc uses a real package.json/TypeScript context; no version is invented.
# The owner restricts mutating formatter targets before final analysis.

# Full repository formatting remains enabled. Only these authority files have
# the user-imposed production-line budget; Ruff lint still checks both files.
[plugins.definitions.ruff.drivers.format]
script = "ruff format --force-exclude --exclude src/the_hive/hive/authority.py --exclude src/codex_master/hive/authority.py ${target}"

# The repository uses GJS and has no ESLint project configuration. These core
# rules do not assume browser/Node globals or change existing application code.
[plugins.definitions.eslint.drivers.lint]
script = "eslint --no-config-lookup --parser-options '{\"ecmaVersion\":2022,\"sourceType\":\"module\"}' --rule 'no-eval:error' --rule 'no-debugger:error' --rule 'no-unreachable:error' --rule 'valid-typeof:error' --rule 'no-dupe-args:error' --rule 'no-duplicate-case:error' --rule 'use-isnan:error' --format json --output-file ${tmpfile} ${target}"

[[exclude]]
plugins = ["mypy"]
file_patterns = ["src/the_hive/selection.py"]

[[exclude]]
plugins = ["kube-linter"]
file_patterns = [".github/workflows/ci.yml", "sgconfig.yml", ".qlty/ast-grep/no-eval.yml", ".semgrep.yaml"]

[plugins.definitions.mypy]
extra_packages = ["types-PyYAML@6.0.12.20260906"]

[plugins.definitions.mypy.drivers.legacy_selection]
script = "mypy --ignore-missing-imports --output json --follow-imports=silent --show-error-codes --show-column-numbers ${target}"
output = "stdout"
output_format = "mypy"
driver_type = "linter"
success_codes = [0, 1]
target = { type = "literal", path = "src/the_hive/selection.py" }
runs_from = { type = "root" }

[plugins.definitions.flake8.drivers.lint]
script = "flake8 --max-line-length=88 ${target} --output-file ${tmpfile} --exit-zero"

[plugins.definitions.vale]
file_types = ["markdown"]

[plugins.definitions.ast-grep]
file_types = ["python", "javascript"]

[plugins.definitions.semgrep]
file_types = ["python", "javascript"]

[plugins.definitions.semgrep.drivers.lint]
script = "EIO_BACKEND=posix semgrep --metrics=off --disable-version-check --config .semgrep.yaml --sarif --output=${tmpfile} ${target}"
