# This repository uses Python, GJS/JavaScript, shell, Markdown, YAML and JSON.
# Keep the applicable language, security and CI validators enabled. The native
# C helpers retain generic security scans and their compile/consumer tests.
# Plugin relevance and absent project contexts are documented in
# docs/operations/qlty-configuration-maintenance.md. Findings never decide this set.
# The owner mutates only active Ruff/Prettier/shfmt targets; the full check also
# validates the other active formatters.

# Full repository formatting remains enabled. Only these authority files have
# the user-imposed production-line budget; Ruff lint still checks both files.
[plugins.definitions.ruff.drivers.format]
script = "ruff format --force-exclude --exclude src/the_hive/hive/authority.py --exclude src/codex_master/hive/authority.py ${target}"

# The repository uses GJS and has no ESLint project configuration. These core
# rules do not assume browser/Node globals or change existing application code.
[plugins.definitions.eslint.drivers.lint]
script = "eslint --no-config-lookup --parser-options '{\"ecmaVersion\":2022,\"sourceType\":\"module\"}' --rule 'no-eval:error' --rule 'no-debugger:error' --rule 'no-unreachable:error' --rule 'valid-typeof:error' --rule 'no-dupe-args:error' --rule 'no-duplicate-case:error' --rule 'use-isnan:error' --format json --output-file ${tmpfile} ${target}"

[plugins.definitions.mypy]
extra_packages = ["types-PyYAML@6.0.12.20260906"]

# Extensionless entrypoints are separate __main__ modules; even
# --scripts-are-modules collides on the two the-hive-home-broker basenames.
# Keep application imports typed when checking each entrypoint on its own.
[plugins.definitions.mypy.drivers.format]
batch = false
script = "MYPYPATH=src mypy --ignore-missing-imports --output json --follow-imports=silent --no-incremental --show-error-codes --show-column-numbers ${target}"
runs_from = { type = "root" }

[plugins.definitions.bandit]
config_files = [".bandit", ".bandit.yaml"]

[plugins.definitions.bandit.drivers.lint]
script = "bandit --exit-zero --ini .bandit --configfile .bandit.yaml --format json --output ${tmpfile} ${target}"

# This root-target driver walks beyond Qlty's selected files. MyPy writes
# temporary cache files concurrently; they are generated, ignored inputs.
[plugins.definitions.trivy.drivers.config]
script = "trivy config ${target} --format sarif --skip-dirs .mypy_cache"

[plugins.definitions.flake8.drivers.lint]
script = "flake8 --max-line-length=88 ${target} --output-file ${tmpfile} --exit-zero"

[plugins.definitions.vale]
file_types = ["markdown"]

[plugins.definitions.ast-grep]
file_types = ["python", "javascript"]

[plugins.definitions.semgrep]
file_types = ["python", "javascript"]

[plugins.definitions.semgrep.drivers.lint]
script = "EIO_BACKEND=posix semgrep --metrics=off --disable-version-check --config .semgrep.yaml --sarif --output=${tmpfile} ${target}"
