name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check pytest ruff==0.16.3 jsonschema "PyJWT[crypto]>=2.9,<3"
          tree-sitter==0.26.0 tree-sitter-javascript==0.25.0 tree-sitter-typescript==0.23.2

      - name: Install manpage renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes groff-base

      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          plugin = json.loads((root / ".codex-plugin" / "plugin.json").read_text(encoding="utf-8"))
          app = json.loads((root / ".app.json").read_text(encoding="utf-8"))
          mcp = json.loads((root / ".mcp.json").read_text(encoding="utf-8"))

          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          assert plugin["name"] == "the-hive"
          assert semver.fullmatch(plugin["version"])
          assert plugin["skills"] == "./skills/"
          assert plugin["mcpServers"] == "./.mcp.json"
          assert plugin["apps"] == "./.app.json"

          app_entry = app["apps"]["the-hive"]
          assert app_entry["id"].startswith(("connector_", "asdk_app_"))

          server = mcp["mcpServers"]["the-hive-mcp"]
          assert server["command"] == "/home/teladi/.local/lib/the-hive-runtime/the-hive-mcp"
          assert server["args"] == []
          assert server["startup_timeout_sec"] == 120
          PY

      - name: Lint Python sources
        run: ruff check --select E4,E7,E9,F --output-format=github .

      - name: Check manpage
        run: |
          set -eu
          ./scripts/the-hive-manpage build --output-dir "${RUNNER_TEMP}/the-hive-man"
          groff -man -Tutf8 man/man1/the-hive-mcp.1 >/dev/null

      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          zero_sha=0000000000000000000000000000000000000000
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA}" ]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] \
            && [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != "${zero_sha}" ] \
            && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null \
            && git merge-base --is-ancestor "${BEFORE_SHA}" "${HEAD_SHA}"; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] \
            && [ -n "${DEFAULT_BRANCH}" ] \
            && git rev-parse --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}" >/dev/null \
            && merge_base="$(git merge-base "refs/remotes/origin/${DEFAULT_BRANCH}" "${HEAD_SHA}")"; then
            range="${merge_base}..${HEAD_SHA}"
          else
            for commit_sha in $(git rev-list --reverse "${HEAD_SHA}"); do
              git diff-tree --check --root --no-commit-id -r "${commit_sha}"
            done
            exit 0
          fi
          git diff --check "${range}"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check Cinnamon applet lifecycle
        run: |
          node --check cinnamon/applets/the-hive@H234598/applet.js
          node --test tests/test_cinnamon_applet.mjs

      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Check CLI wrapper syntax
        run: bash -n ./bin/the-hive-mcp ./bin/the-hive-mcp-stable ./bin/the-hive-plugin-hook-stable

      - name: Check agent pool installer
        run: |
          set -eu
          home="${RUNNER_TEMP}/codex-agent-pool-ci-home"
          mkdir -m 700 "${home}"
          report="${RUNNER_TEMP}/codex-agent-pool-installer-report.json"
          errors="${RUNNER_TEMP}/codex-agent-pool-installer-stderr"
          status=0
          ./scripts/the-hive-hive-hourly-probe-install --home "${home}" >"${report}" 2>"${errors}" || status=$?
          test "${status}" -eq 1
          python3 - "${home}" "${report}" "${errors}" <<'PYTHON'
          import json
          import pathlib
          import sys

          home, report, errors = map(pathlib.Path, sys.argv[1:])
          expected = {
              "status": "runtime_lifecycle_cutover_required",
              "raw_output": "not_returned",
          }
          if json.loads(report.read_text(encoding="utf-8")) != expected:
              raise SystemExit("unexpected installer boundary payload")
          if errors.read_bytes():
              raise SystemExit("unexpected installer stderr")
          if any(home.iterdir()):
              raise SystemExit("installer boundary mutated the temporary home")
          print(json.dumps(expected, sort_keys=True))
          PYTHON
