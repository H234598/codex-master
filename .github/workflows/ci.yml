name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up pinned producer Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.8"

      - name: Install pinned offline producer build backend
        run: |
          # The producer executes this interpreter by FD with -I.
          python -m pip install --disable-pip-version-check "pytest>=8.0" \
            "setuptools @ https://files.pythonhosted.org/packages/95/9c/c510029fc6ef33a6275cd2c5d3cecd6613dfd6aa401d57c54f1c18852ccf/setuptools-84.0.0-py3-none-any.whl#sha256=51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670"
          echo "THE_HIVE_TEST_CODEX_USAGE_PYTHON=${pythonLocation}/bin/python3.14" >> "${GITHUB_ENV}"

      - name: Set up test Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            python3-selinux \
            python3-yaml tmux \
            shellcheck \
            build-essential pkg-config libdbus-1-dev libgirepository-2.0-dev libcairo2-dev \
            gir1.2-glib-2.0 dbus \
            groff-base
          # SELinux is a native distro binding, not the similarly named PyPI shim.

      - name: Expose native SELinux binding to test Python
        run: |
          native_site="${RUNNER_TEMP}/the-hive-native-python"
          mkdir -m 700 "${native_site}"
          test -f /usr/lib/python3/dist-packages/selinux/__init__.py
          ln -s /usr/lib/python3/dist-packages/selinux "${native_site}/selinux"
          PYTHONPATH="${native_site}" python -c 'import selinux; assert callable(selinux.is_selinux_enabled)'
          echo "THE_HIVE_TEST_NATIVE_PYTHON=${native_site}" >> "${GITHUB_ENV}"

      - name: Fetch pinned Codex Usage producer source
        env:
          CODEX_USAGE_COMMIT: f495de4fdae9e99d474a65129028984efb8b555d
        run: |
          producer_root="${RUNNER_TEMP}/codex-usage-test-source"
          git init "${producer_root}"
          git -C "${producer_root}" remote add origin https://github.com/H234598/codex-usage.git
          git -C "${producer_root}" fetch --depth=1 origin "${CODEX_USAGE_COMMIT}"
          git -C "${producer_root}" checkout --detach FETCH_HEAD
          test "$(git -C "${producer_root}" rev-parse HEAD)" = "${CODEX_USAGE_COMMIT}"
          echo "THE_HIVE_TEST_CODEX_USAGE_ROOT=${producer_root}" >> "${GITHUB_ENV}"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "setuptools>=69" ".[test,test-index]"

      - name: Fetch and verify the pinned Codex client fixture
        run: |
          client_root="${RUNNER_TEMP}/the-hive-codex-0161"
          install -d -m 700 "${client_root}"
          archive="${client_root}/codex-0.161.0-linux-x64.tgz"
          client="${client_root}/codex"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            'https://registry.npmjs.org/@openai/codex/-/codex-0.161.0-linux-x64.tgz' \
            --output "${archive}"
          chmod 600 "${archive}"
          python - "${archive}" "${client}" <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          client = Path(sys.argv[2])
          expected_sri = (
              "sha512-AVkNzeJWyCHHPyg5vxD8UE6aFsYaOwq0/"
              "x6mtmkOKy6LdjvsyxLr7Q7UULlk+Ma3+PnrN8uIxG2/"
              "XGPQ936hgA=="
          )
          expected_elf_sha256 = (
              "9a820c17865fa825d04db416818679a9d63bd72e"
              "50835c396f496e5684626c9c"
          )
          expected_member = (
              "package/vendor/x86_64-unknown-linux-musl/bin/codex"
          )
          with archive.open("rb") as stream:
              actual_sri = "sha512-" + base64.b64encode(
                  hashlib.file_digest(stream, "sha512").digest()
              ).decode("ascii")
          if actual_sri != expected_sri:
              raise SystemExit("official Codex tarball SRI did not match the pin")

          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              if len(members) != 46:
                  raise SystemExit("official Codex archive member count changed")
              target = None
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or path.parts[0] != "package"
                      or not member.isfile()
                      or member.type != tarfile.REGTYPE
                      or member.mode & 0o7000
                  ):
                      raise SystemExit("unsafe or unexpected Codex archive member")
                  if member.name == expected_member:
                      target = member
              if target is None or target.mode != 0o755 or target.size <= 0:
                  raise SystemExit("pinned Codex ELF member was missing or changed")
              source = bundle.extractfile(target)
              if source is None:
                  raise SystemExit("pinned Codex ELF could not be read")
              descriptor = os.open(
                  client,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_CLOEXEC", 0),
                  0o700,
              )
              digest = hashlib.sha256()
              size = 0
              with os.fdopen(descriptor, "wb") as output:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      output.write(chunk)
                      digest.update(chunk)
                      size += len(chunk)
                  output.flush()
                  os.fsync(output.fileno())
                  os.fchmod(output.fileno(), 0o755)
              if size != target.size or digest.hexdigest() != expected_elf_sha256:
                  client.unlink(missing_ok=True)
                  raise SystemExit("pinned Codex ELF digest or size changed")
              info = client.lstat()
              if (
                  not stat.S_ISREG(info.st_mode)
                  or info.st_nlink != 1
                  or stat.S_IMODE(info.st_mode) != 0o755
              ):
                  client.unlink(missing_ok=True)
                  raise SystemExit("extracted Codex ELF metadata changed")
          print(f"verified_codex_client={client}")
          print(f"verified_codex_elf_sha256={expected_elf_sha256}")
          PY
          echo "THE_HIVE_TEST_CODEX_CLIENT=${client}" >> "${GITHUB_ENV}"

      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          plugin = json.loads((root / ".codex-plugin" / "plugin.json").read_text(encoding="utf-8"))
          app = json.loads((root / ".app.json").read_text(encoding="utf-8"))
          mcp = json.loads((root / ".mcp.json").read_text(encoding="utf-8"))

          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          assert plugin["name"] == "the-hive"
          assert semver.fullmatch(plugin["version"])
          assert plugin["skills"] == "./skills/"
          assert plugin["mcpServers"] == "./.mcp.json"
          assert plugin["apps"] == "./.app.json"

          app_entry = app["apps"]["the-hive"]
          assert app_entry["id"].startswith(("connector_", "asdk_app_"))

          server = mcp["mcpServers"]["the-hive-mcp"]
          assert server["command"] == "/home/teladi/.local/lib/the-hive-runtime/the-hive-mcp"
          assert server["args"] == []
          assert server["startup_timeout_sec"] == 120
          PY

      - name: Lint Python sources
        run: ruff check --select E4,E7,E9,F --output-format=github .

      - name: Check manpage
        run: |
          set -eu
          ./scripts/the-hive-manpage build --output-dir "${RUNNER_TEMP}/the-hive-man"
          groff -man -Tutf8 man/man1/the-hive-mcp.1 >/dev/null

      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          zero_sha=0000000000000000000000000000000000000000
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA}" ]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] \
            && [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != "${zero_sha}" ] \
            && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null \
            && git merge-base --is-ancestor "${BEFORE_SHA}" "${HEAD_SHA}"; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] \
            && [ -n "${DEFAULT_BRANCH}" ] \
            && git rev-parse --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}" >/dev/null \
            && merge_base="$(git merge-base "refs/remotes/origin/${DEFAULT_BRANCH}" "${HEAD_SHA}")"; then
            range="${merge_base}..${HEAD_SHA}"
          else
            for commit_sha in $(git rev-list --reverse "${HEAD_SHA}"); do
              git diff-tree --check --root --no-commit-id -r "${commit_sha}"
            done
            exit 0
          fi
          git diff --check "${range}"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check Cinnamon applet lifecycle
        run: |
          node --check cinnamon/applets/the-hive@H234598/applet.js
          node --test tests/test_cinnamon_applet.mjs

      - name: Run pinned producer contract tests with Python 3.14
        run: >-
          PYTHONPATH="src:${THE_HIVE_TEST_CODEX_USAGE_ROOT}/src"
          "${THE_HIVE_TEST_CODEX_USAGE_PYTHON}" -m pytest -q tests/test_usage_snapshot.py

      - name: Run remaining unit tests with Python 3.12
        run: |
          set -eu
          pytest_parent="$(mktemp -d "${HOME}/.the-hive-pytest.XXXXXX")"
          chmod 700 "${pytest_parent}"
          pytest_tmp="${pytest_parent}/basetemp"
          PYTHONPATH="src:${THE_HIVE_TEST_CODEX_USAGE_ROOT}/src:${THE_HIVE_TEST_NATIVE_PYTHON}" \
            python -m pytest -q --basetemp="${pytest_tmp}" --ignore=tests/test_usage_snapshot.py

      - name: Check CLI wrapper syntax
        run: |
          shellcheck ./bin/the-hive-mcp ./bin/the-hive-mcp-stable ./bin/the-hive-plugin-hook-stable
          bash -n ./bin/the-hive-mcp ./bin/the-hive-mcp-stable ./bin/the-hive-plugin-hook-stable

      - name: Check agent pool installer
        run: |
          set -eu
          home="${RUNNER_TEMP}/codex-agent-pool-ci-home"
          mkdir -m 700 "${home}"
          report="${RUNNER_TEMP}/codex-agent-pool-installer-report.json"
          errors="${RUNNER_TEMP}/codex-agent-pool-installer-stderr"
          status=0
          ./scripts/the-hive-hive-hourly-probe-install --home "${home}" >"${report}" 2>"${errors}" || status=$?
          test "${status}" -eq 1
          python3 - "${home}" "${report}" "${errors}" <<'PYTHON'
          import json
          import pathlib
          import sys

          home, report, errors = map(pathlib.Path, sys.argv[1:])
          expected = {
              "status": "runtime_lifecycle_cutover_required",
              "raw_output": "not_returned",
          }
          if json.loads(report.read_text(encoding="utf-8")) != expected:
              raise SystemExit("unexpected installer boundary payload")
          if errors.read_bytes():
              raise SystemExit("unexpected installer stderr")
          if any(home.iterdir()):
              raise SystemExit("installer boundary mutated the temporary home")
          print(json.dumps(expected, sort_keys=True))
          PYTHON
