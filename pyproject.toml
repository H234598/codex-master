[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-master"
version = "0.10.5"
description = "Local MCP wrapper for controlling a sleeping Codex Agentinnen pool via tmux"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "dbus-python==1.4.0",
  "PyGObject==3.56.3",
]

[project.scripts]
codex-master-mcp = "codex_master.server:main"

[tool.setuptools.packages.find]
where = ["src"]
