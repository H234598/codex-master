[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-master"
version = "0.10.5"
description = "Local MCP wrapper for controlling a sleeping Codex Agentinnen pool via tmux"
requires-python = ">=3.11"
dependencies = [
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6.0",
  "dbus-python==1.4.0",
  "PyGObject==3.56.3",
]

[project.optional-dependencies]
google-identity = [
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
codex-master-mcp = "codex_master.server:main"
google-account-manager = "codex_master.google_account_manager_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_master = ["markdown/*.md", "markdown/classes/*.md"]
